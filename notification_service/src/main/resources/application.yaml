logging:
  level:
    by.Egrius.notification_service: DEBUG
    org.springframework.core.env: DEBUG

server:
  port:  ${NOTIFICATION_SERVICE_PORT:8081}

spring:
  application:
    name: notification_service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${AUTH_SERVER_HOST}:${AUTH_SERVER_PORT}

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:api_gateway_notifications_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:2Pg8_06Egr}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create

    show-sql: true
    properties:
      hibernate:
        format_sql: true
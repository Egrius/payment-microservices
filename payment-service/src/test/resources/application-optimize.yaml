logging:
  level:
    # === SQL and Hibernate ===
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE  # params
    org.hibernate.orm.jdbc.extract: TRACE  # data extraction from ResultSet
    org.hibernate.stat: DEBUG  # stats
    org.hibernate.engine.transaction.internal.TransactionImpl: DEBUG
    org.hibernate.engine.query.spi.HQLQueryPlan: DEBUG

    # === Transactions ===
    org.springframework.transaction: DEBUG
    org.springframework.transaction.interceptor: TRACE

    # === Spring Cache ===
    org.springframework.cache: DEBUG
    org.springframework.cache.interceptor: TRACE

    # === JDBC Driver ===
    org.postgresql: DEBUG
    org.postgresql.jdbc: DEBUG
    com.zaxxer.hikari: DEBUG

    by.egrius.api_gateway: DEBUG

spring:
  main:
    allow-bean-definition-overriding: true

#  datasource:
#    url: jdbc:postgresql://localhost:5432/testdb
#    username: test
#    password: test
#    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      format_sql: true
      use_sql_comments: true
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_inserts: true
        format_sql: true
        generate_statistics: true
services:

  # DB for payment_service
  payment_db:
    environment:
      - POSTGRES_DB=api_gateway_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=2Pg8_06Egr

    image: postgres:16-alpine

    ports:
      - "5435:5432"

    networks:
      - app-network

  # DB for auth_server
  auth_db:
    hostname: auth_db
    environment:

      - POSTGRES_DB=api_gateway_auth_server_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=2Pg8_06Egr

    image: postgres:16-alpine
    ports:
      - "5433:5432"

    networks:
      - app-network

    volumes:
      -  auth_db_data:/var/lib/postgresql/data
      - ./oauth2-registered-client-schema.sql:/docker-entrypoint-initdb.d/01-oauth2-registered-client-schema.sql
      - ./oauth2-authorization-schema.sql:/docker-entrypoint-initdb.d/02-oauth2-authorization-schema.sql
      - ./oauth2-authorization-consent-schema.sql:/docker-entrypoint-initdb.d/03-oauth2-authorization-consent-schema.sql

# microservices

  auth-server:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://{$AUTH_SERVER_HOST}:{$AUTH_SERVER_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - auth_db

    environment:
      - DB_HOST=auth_db
      - DB_PORT=5432
      - DB_NAME=api_gateway_auth_server_db
      - AUTH_SERVER_ISSUER=http://auth-server:9000

    build:
      context: ../../../../../auth-server
      dockerfile: Dockerfile

    ports:
      - "${AUTH_SERVER_PORT}:${AUTH_SERVER_PORT}"

    env_file:
      - ./.env

    networks:
      - app-network

  payment-service:
    restart: on-failure

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://{$PAYMENT_SERVICE_HOST}:${PAYMENT_SERVICE_PORT}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    depends_on:
      auth-server:
        condition: service_healthy

    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=payment_db
      - DB_PORT=5432
      - DB_NAME=api_gateway_db
      - RABBIT_HOST=rabbitmq

    build:
      context: ../../../../
      dockerfile: Dockerfile

    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"

    env_file:
      - ./.env

    networks:
      - app-network

# rabbitMQ for payment_service
  rabbitmq:
    image: rabbitmq:4.0.3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network

# Redis for payment_service
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  auth_db_data:
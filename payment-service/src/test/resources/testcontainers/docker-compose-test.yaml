services:

# microservices

  payment-service:
    depends_on:
      - auth-server
      - payment_db
      - rabbitmq
      - redis

    environment:
      - PAYMENT_SERVICE_HOST=payment-service
      - PAYMENT_SERVICE_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=payment_db
      - DB_PORT=5432
      - DB_NAME=api_gateway_db
      - DB_USER=postgres
      - DB_PASSWORD=2Pg8_06Egr
      - RABBIT_HOST=rabbitmq
      - REDIS_HOST=redis
      - AUTH_SERVER_HOST=auth-server
      - AUTH_SERVER_PORT=9000

    build:
      context: ../../../../
      dockerfile: Dockerfile

    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    networks:
      - app-network

  auth-server:
    depends_on:
      - auth_db

    environment:
      - PAYMENT_SERVICE_HOST=payment-service
      - PAYMENT_SERVICE_PORT=8080
      - AUTH_SERVER_PORT=9000
      - DB_HOST=auth_db
      - DB_PORT=5432
      - DB_NAME=api_gateway_auth_server_db
      - DB_USER=postgres
      - DB_PASSWORD=2Pg8_06Egr
      - AUTH_SERVER_ISSUER=http://auth-server:9000

    build:
      context: ../../../../../auth-server
      dockerfile: Dockerfile

    ports:
      - "${AUTH_SERVER_PORT}:${AUTH_SERVER_PORT}"

    networks:
      - app-network

# rabbitMQ for payment_service
  rabbitmq:
    image: rabbitmq:4.0.3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network

# Redis for payment_service
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

# DB for payment_service
  payment_db:
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=2Pg8_06Egr
      - POSTGRES_DB=api_gateway_db

    image: postgres:16-alpine
    ports:
      - "5435:5432"
    networks:
      - app-network

# DB for auth_server
  auth_db:
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=2Pg8_06Egr
      - POSTGRES_DB=api_gateway_auth_server_db
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
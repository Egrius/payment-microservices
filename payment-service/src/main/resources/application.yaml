server:
  port: ${PAYMENT_SERVICE_PORT:8080}

auth:
  server:
    host: ${AUTH_SERVER_HOST:auth-server.local}
    port: ${AUTH_SERVER_PORT:9000}

logging:
  level:
    org.springframework.security.oauth2.client.oidc: DEBUG
    org.springframework.security.oauth2.client.userinfo: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.web.client: DEBUG

    by.egrius.api_gateway: DEBUG
    org.springframework.cache: DEBUG
    org.springframework.data.redis: DEBUG

spring:
  application:
    name: api-gateway

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: /

  security:
    oauth2:
      client:
        registration:
          auth-server:
            provider: auth-server
            client-id: "payment-service"
            client-secret: "payment-service-password"
            authorization-grant-type: authorization_code
            redirect-uri: "http://${PAYMENT_SERVICE_HOST:payment-service.local}:${PAYMENT_SERVICE_PORT:8080}/login/oauth2/code/auth-server"
            scope: openid, profile
        provider:
          auth-server:
            user-name-attribute: email
            issuer-uri: http://${AUTH_SERVER_HOST:auth-server.local}:${AUTH_SERVER_PORT:9000}

      resourceserver:
        jwt:
          issuer-uri: http://${AUTH_SERVER_HOST:auth-server.local}:${AUTH_SERVER_PORT:9000}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:api_gateway_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:2Pg8_06Egr}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        format_sql: true
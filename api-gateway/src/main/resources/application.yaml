logging:
  level:
    org.springframework.security.oauth2.client.web: DEBUG
    org.springframework.security.web: DEBUG

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      client:
        registration:
          auth-server:
            provider: auth-server
            client-id: "api-gateway"
            client-secret: "api-gateway-password"
            authorization-grant-type: authorization_code
            redirect-uri: "http://api-gateway.local:8080/login/oauth2/code/auth-server"
            # "http://api-gateway.local:8080/custom/oauth2/callback"
            scope: openid, profile
        provider:
          auth-server:
            issuer-uri: http://auth-server.local:9000

      resourceserver:
        jwt:
          issuer-uri: http://auth-server.local:9000

  datasource:
    url: jdbc:postgresql://localhost:5432/api_gateway_db
    username: postgres
    password: 2Pg8_06Egr
    driver-class-name: org.postgresql.Driver

    jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        ddl-auto: create

      show-sql: false
      properties:
        hibernate:
          format_sql: true